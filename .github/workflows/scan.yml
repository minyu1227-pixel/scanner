name: Scanner

# GitHub → Actions → Scanner → "Run workflow" 버튼으로 수동 실행
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "조회할 종목 (예: TSLA AAPL 또는 TSLA,AAPL). 비우면 전체 스캔"
        required: false
        default: ""
        type: string
      max_signals:
        description: "종목 조회 시 종목별로 보낼 최근 시그널 수 (0 = 전부)"
        required: false
        default: 10
        type: number

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치 (yfinance, pandas)
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: scanner.py 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CODES: ${{ inputs.codes }}
          MAX_SIGNALS: ${{ inputs.max_signals }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_TOKEN / TELEGRAM_CHAT_ID Secret이 비어 있어 텔레그램 전송이 생략됩니다."
          fi

          if [ -n "$CODES" ]; then
            # 입력값을 공백 기준으로 나눠 인자로 전달 (쉼표 구분은 scanner.py가 처리)
            read -ra CODE_ARGS <<< "$CODES"
            python scanner.py --codes "${CODE_ARGS[@]}" --max-signals "$MAX_SIGNALS"
          else
            python scanner.py
          fi

      - name: 스캔 결과 CSV 보관
        if: always() && hashFiles('scan_*.csv') != ''
        uses: actions/upload-artifact@v4
        with:
          name: scan-result
          path: scan_*.csv
          retention-days: 14
