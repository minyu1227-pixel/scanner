name: Scanner KR

# 국내주식 스캐너 (미국용 scan.yml과 별개)
# worker_kr(Cloudflare)가 평일 16:30 KST에 실행 / Actions → Scanner KR → "Run workflow"로 수동 실행
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "조회할 종목 코드 또는 이름 (예: 005930 000660 또는 삼성전자,SK하이닉스). 비우면 전체 스캔"
        required: false
        default: ""
        type: string
      max_signals:
        description: "종목 조회 시 종목별로 보낼 최근 시그널 수 (0 = 전부)"
        required: false
        default: 10
        type: number

permissions:
  contents: read
  id-token: write   # AWS OIDC 임시 자격 증명 (SSM /scanner-kr/signals/ 저장용)

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치 (yfinance, pandas, lxml, boto3)
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas lxml boto3

      - name: AWS 인증 (OIDC, 시그널 SSM 저장용)
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::983160805350:role/mck-github-scanner-role
          aws-region: ap-northeast-2

      - name: scanner_kr.py 실행
        env:
          TELEGRAM_TOKEN_KR: ${{ secrets.TELEGRAM_TOKEN_KR }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CODES: ${{ inputs.codes }}
          MAX_SIGNALS: ${{ inputs.max_signals }}
          SIGNAL_DELIVERY: ${{ steps.aws.outcome == 'success' && 'ssm' || 'direct' }}
        run: |
          if [ -z "$TELEGRAM_TOKEN_KR" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_TOKEN_KR / TELEGRAM_CHAT_ID Secret이 비어 있어 텔레그램 전송이 생략됩니다."
          fi

          if [ -n "$CODES" ]; then
            read -ra CODE_ARGS <<< "$CODES"
            python scanner_kr.py --codes "${CODE_ARGS[@]}" --max-signals "$MAX_SIGNALS"
          else
            python scanner_kr.py
          fi

      - name: 스캔 결과 CSV 보관
        if: always() && hashFiles('scan_kr_*.csv') != ''
        uses: actions/upload-artifact@v4
        with:
          name: scan-kr-result
          path: scan_kr_*.csv
          retention-days: 14
